# Dependabot version updates. Security updates and alerts are turned on in the
# repository settings (Settings > Advanced Security); this file only schedules
# routine updates so pinned versions do not go stale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per week for non-breaking updates. Major versions (for example
      # Astro or Zod) still arrive as separate PRs so they can be reviewed alone.
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Workflow actions are pinned to commit SHAs; this keeps the pins and
      # their version comments current.
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
