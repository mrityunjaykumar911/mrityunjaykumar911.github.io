research:
  feature:
    label: Graduate research · Stony Brook University · Advisor Prof. Shuai Mu
    title: Replicating multi-core transactions without giving up performance.
    body: >-
      Asynchronous replication with multi-process Paxos to remove contention;
      a header-only C++ logging library (~1200 LOC) with aligned allocators,
      rotating logs, and auto-flush; an optimistic replay protocol for
      serializability with a stream-verification pipeline; and evaluation
      micro-benchmarks profiled with mutrace and gprof. Development and
      early-stage evaluation contributions to Rolis (EuroSys 2022).
    link:
      href: http://mpaxos.com/
      text: Visit the research group

  notes:
    - type: Publication
      title: "Rolis: a software approach to efficiently replicating multi-core transactions"
      meta: EuroSys 2022 · development & early-stage evaluation
      href: https://dl.acm.org/doi/10.1145/3492321.3519576
    - type: Patent
      title: Verification of metadata consistency across snapshot COW B+ tree logical maps
      meta: US11573860B1
      href: https://patents.google.com/patent/US11573860B1
    - type: Publication
      title: Learning to fingerprint the latent structure in question articulation
      meta: R. Guntur, M. Kumar · IEEE ICMLA 2018 · pp. 73–80
      href: https://ieeexplore.ieee.org/document/8614044
    - type: Teaching
      title: "Teaching Assistant — Introduction to Data Science (CSE-351)"
      meta: Stony Brook University · with Prof. Martin Radfar · 2019
    - type: Systems project
      title: Sharded, replicated, fault-tolerant key-value store on Raft
      meta: CSE 535 Asynchronous Systems Lab
    - type: Systems project
      title: Distributed MapReduce library with worker-failure recovery
      meta: CSE 535 Asynchronous Systems Lab
    - type: Kernel project
      title: Versioned stackable backup filesystem for the Linux kernel
      meta: Stony Brook FSL · queue-based versioning + retention policy
    - type: Kernel project
      title: AES encrypt / decrypt system call via the kernel crypto API
      meta: Stony Brook FSL
    - type: Project
      title: Mood- and activity-based music recommendation
      meta: Data Visualization Lab
      href: https://sbu-musicx.up.railway.app/user.html

